<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【病院用】予約・患者管理ダッシュボード</title>
  <style>
    :root {
      --primary: #06C755;
      --primary-dark: #047857;
      --primary-light: #e8f9ee;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-main: #111827;
      --text-sub: #4b5563;
      --border-color: #d1d5db;
    }

    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); margin: 0; padding: 20px; color: var(--text-main); font-size: 18px; font-weight: 500; }
    
    /* ヘッダー */
    .header { background: var(--card-bg); padding: 20px 24px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); border: 1px solid var(--border-color); }
    h1 { margin: 0 0 16px 0; font-size: 1.6rem; color: var(--primary-dark); font-weight: 800; }
    .nav-tabs { display: flex; gap: 12px; border-bottom: 3px solid #e5e7eb; padding-bottom: 10px; }
    .tab-btn { padding: 12px 22px; border: none; background: none; font-size: 1.1rem; font-weight: 800; color: var(--text-sub); cursor: pointer; border-radius: 8px; }
    .tab-btn.active { background: var(--primary-dark); color: #fff; }

    /* フィルター */
    .filter-box { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; font-size: 1.1rem; font-weight: 700; }
    input[type="date"], textarea { padding: 12px 16px; border: 2px solid #9ca3af; border-radius: 8px; font-size: 1.05rem; font-weight: 700; }
    .btn-action { padding: 12px 20px; background: #374151; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 800; font-size: 1.05rem; }
    .btn-green { background: var(--primary); }
    .btn-dark { background: var(--primary-dark); }

    /* テーブル */
    .table-container { background: var(--card-bg); border-radius: 12px; overflow-x: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid var(--border-color); }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 1.05rem; min-width: 1350px; }
    th { background: #f3f4f6; color: #111827; padding: 16px; font-weight: 800; border-bottom: 3px solid #d1d5db; white-space: nowrap; font-size: 1.1rem; }
    td { padding: 16px; border-bottom: 1px solid #e5e7eb; vertical-align: middle; }
    tr:hover { background: #f9fafb; }

    /* 各セル用スタイル（極太字＆拡大） */
    .time-cell { font-weight: 900; color: var(--primary-dark); font-size: 1.25rem; line-height: 1.3; }
    .time-cell small { color: #374151; font-size: 0.95rem; font-weight: 700; display: block; margin-top: 4px; }
    
    .owner-name { font-weight: 900; color: #111827; font-size: 1.15rem; }
    .phone-badge { display: inline-block; background: #e5e7eb; color: #111827; font-size: 1rem; padding: 6px 10px; border-radius: 6px; font-weight: 800; border: 1px solid #d1d5db; }

    .visit-badge { display: inline-block; padding: 6px 12px; border-radius: 6px; font-size: 0.95rem; font-weight: 900; }
    .visit-初診 { background: #fee2e2; color: #991b1b; border: 1.5px solid #f87171; }
    .visit-再診 { background: #dcfce7; color: #166534; border: 1.5px solid #4ade80; }

    .pet-name-box { font-size: 1.2rem; font-weight: 900; color: #111827; }
    .pet-info-box { color: #374151; font-size: 0.95rem; font-weight: 700; margin-top: 2px; }

    .menu-badge { font-weight: 900; color: #047857; font-size: 1.1rem; }
    .memo-text { font-size: 1rem; color: #111827; font-weight: 600; line-height: 1.45; max-width: 300px; word-break: break-word; }

    /* ステータスバッジ */
    .badge { padding: 8px 14px; border-radius: 16px; font-size: 0.95rem; font-weight: 900; display: inline-block; white-space: nowrap; }
    .badge-予約受付 { background: #bae6fd; color: #0369a1; }
    .badge-受付済 { background: #fde68a; color: #92400e; }
    .badge-診察完了 { background: #bbf7d0; color: #15803d; }
    .badge-キャンセル { background: #fca5a5; color: #991b1b; }

    /* 操作ボタン */
    .btn-group-sm { display: flex; flex-wrap: wrap; gap: 6px; width: 170px; }
    .btn-sm { padding: 8px 10px; border: none; border-radius: 6px; font-size: 0.9rem; font-weight: 800; cursor: pointer; }
    .btn-sm-check { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .btn-sm-complete { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .btn-sm-reset { background: #e5e7eb; color: #374151; border: 1px solid #d1d5db; }
    .btn-sm-cancel { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .btn-sm-line { background: var(--primary); color: #fff; width: 100%; margin-top: 4px; font-size: 0.95rem; padding: 8px; font-weight: 900; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* モーダル */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
    .modal-content { background: #fff; padding: 28px; border-radius: 14px; width: 90%; max-width: 520px; font-size: 1.1rem; font-weight: 700; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🏥 アルブル動物病院 予約・患者管理</h1>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('reservations')">📅 予約一覧</button>
      <button class="tab-btn" onclick="switchTab('patients')">🐾 患者名簿</button>
      <button class="tab-btn" onclick="switchTab('broadcast')">📢 一括LINE配信</button>
    </div>
  </div>

  <!-- TAB 1: 予約一覧 -->
  <div id="tab-reservations" class="tab-content active">
    <div class="filter-box">
      <label style="font-weight:900;">日付絞り込み:</label>
      <input type="date" id="datePicker" onchange="filterReservations()">
      <button class="btn-action btn-dark" onclick="showAllReservations()">全件表示</button>
      <button class="btn-action" onclick="loadData()">🔄 データ更新</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width: 120px;">予約日時</th>
            <th style="width: 130px;">飼い主名</th>
            <th style="width: 150px;">電話番号</th>
            <th style="width: 130px;">診察区分</th>
            <th style="width: 140px;">ペット名</th>
            <th style="width: 140px;">ペット情報</th>
            <th style="width: 130px;">メニュー</th>
            <th>症状・メモ</th>
            <th style="width: 110px;">状態</th>
            <th style="width: 175px;">操作 / LINE</th>
          </tr>
        </thead>
        <tbody id="reservationTableBody">
          <tr><td colspan="10" style="text-align:center; padding:40px; font-size:1.1rem; font-weight:bold;">データを読み込み中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- TAB 2: 患者名簿 -->
  <div id="tab-patients" class="tab-content">
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>飼い主名</th>
            <th>ペット名</th>
            <th>LINE ID</th>
            <th>受診回数</th>
            <th>最終受診日</th>
            <th>個別連絡</th>
          </tr>
        </thead>
        <tbody id="patientTableBody">
          <tr><td colspan="6" style="text-align:center; padding:40px; font-size:1.1rem; font-weight:bold;">患者データを集計中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- TAB 3: 一括LINE配信 -->
  <div id="tab-broadcast" class="tab-content">
    <div style="background:#fff; padding:28px; border-radius:12px; max-width:640px; border:2px solid #d1d5db;">
      <h3 style="margin-top:0; color:var(--primary-dark); font-size:1.3rem; font-weight:900;">📢 全員への一括LINE配信</h3>
      <textarea id="broadcastMsg" rows="5" style="width:100%; margin-top:10px; font-size:1.05rem;" placeholder="【お知らせ】休診日案内など..."></textarea>
      <button class="btn-action btn-green" style="width:100%; margin-top:16px; padding:14px; font-size:1.1rem;" onclick="sendBroadcast()">一括配信を実行する</button>
    </div>
  </div>

  <!-- 個別LINEモーダル -->
  <div id="msgModal" class="modal">
    <div class="modal-content">
      <h3 id="modalTargetName" style="margin-top:0; font-size:1.3rem; font-weight:900;">LINE個別送信</h3>
      <textarea id="individualMsg" rows="4" style="width:100%; font-size:1.05rem;" placeholder="メッセージを入力..."></textarea>
      <div style="display:flex; gap:12px; margin-top:18px;">
        <button class="btn-action" style="flex:1;" onclick="closeModal()">キャンセル</button>
        <button class="btn-action btn-green" style="flex:1;" onclick="submitIndividualMsg()">送信する</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycby2hQKwINtq3r21e4pxhe_SQ_U_44ejXTA_Xp1mzsY7x4g7rF-zTM7YChI_ar5Rg2Y3nA/exec";
    
    let allReservations = [];
    let currentTargetUserId = '';

    window.onload = () => {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      document.getElementById('datePicker').value = `${yyyy}-${mm}-${dd}`;
      
      loadData();
    };

    function loadData() {
      fetch(GAS_URL)
        .then(res => res.json())
        .then(data => {
          allReservations = data;
          filterReservations();
          renderPatientTable();
        })
        .catch(err => {
          document.getElementById('reservationTableBody').innerHTML = "<tr><td colspan='10' style='color:red; text-align:center; font-weight:bold;'>データ読み込みエラー</td></tr>";
        });
    }

    function normalizeDateStr(str) {
      if (!str) return '';
      const matched = String(str).match(/(\d{4})[^\d]?(\d{1,2})[^\d]?(\d{1,2})/);
      if (!matched) return '';
      return `${matched[1]}-${matched[2].padStart(2, '0')}-${matched[3].padStart(2, '0')}`;
    }

    function filterReservations() {
      const selectedDate = document.getElementById('datePicker').value;
      if (!selectedDate) {
        renderReservationTable(allReservations);
        return;
      }

      const filtered = allReservations.filter(r => normalizeDateStr(r.date) === selectedDate);
      renderReservationTable(filtered);
    }

    function showAllReservations() {
      document.getElementById('datePicker').value = '';
      renderReservationTable(allReservations);
    }

    function renderReservationTable(list) {
      const tbody = document.getElementById('reservationTableBody');
      if (!list || list.length === 0) {
        tbody.innerHTML = "<tr><td colspan='10' style='text-align:center; color:#6b7280; padding:40px; font-size:1.1rem; font-weight:bold;'>該当する予約はありません</td></tr>";
        return;
      }

      tbody.innerHTML = list.map(r => {
        const isFirst = r.visitType && r.visitType.includes('初診');
        const visitClass = isFirst ? 'visit-初診' : 'visit-再診';

        return `
          <tr>
            <td class="time-cell">
              ${r.time}
              <small>${r.date}</small>
            </td>
            <td><div class="owner-name">👤 ${r.lineUserName || '不明'}</div></td>
            <td><div class="phone-badge">📞 ${r.phoneNo || '-'}</div></td>
            <td><span class="visit-badge ${visitClass}">${r.visitType || '-'}</span></td>
            <td><div class="pet-name-box">🐾 ${r.petName}</div></td>
            <td><div class="pet-info-box">${r.petInfo || '-'}</div></td>
            <td><span class="menu-badge">${r.menu}</span></td>
            <td><div class="memo-text">${r.symptoms || 'なし'}</div></td>
            <td><span class="badge badge-${r.status}">${r.status}</span></td>
            <td>
              <div class="btn-group-sm">
                <button class="btn-sm btn-sm-check" onclick="updateStatus(${r.rowIndex}, '受付済')">受付</button>
                <button class="btn-sm btn-sm-complete" onclick="updateStatus(${r.rowIndex}, '診察完了')">完了</button>
                <button class="btn-sm btn-sm-reset" onclick="updateStatus(${r.rowIndex}, '予約受付')">戻す</button>
                <button class="btn-sm btn-sm-cancel" onclick="updateStatus(${r.rowIndex}, 'キャンセル')">取消</button>
                <button class="btn-sm btn-sm-line" onclick="openModal('${r.lineUserId}', '${r.lineUserName || r.petName}')">💬 LINE送信</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function renderPatientTable() {
      const tbody = document.getElementById('patientTableBody');
      const patientsMap = {};

      allReservations.forEach(r => {
        if (!r.petName) return;
        const key = `${r.lineUserName}_${r.petName}`;
        if (!patientsMap[key]) {
          patientsMap[key] = { ownerName: r.lineUserName || '不明', petName: r.petName, lineUserId: r.lineUserId, count: 0, lastDate: r.date };
        }
        patientsMap[key].count += 1;
        patientsMap[key].lastDate = r.date;
      });

      const patientList = Object.values(patientsMap);
      if (patientList.length === 0) {
        tbody.innerHTML = "<tr><td colspan='6' style='text-align:center; color:#6b7280; padding:40px; font-weight:bold;'>患者データがありません</td></tr>";
        return;
      }

      tbody.innerHTML = patientList.map(p => `
        <tr>
          <td><strong style="font-size:1.15rem; font-weight:900;">👤 ${p.ownerName}</strong></td>
          <td><strong style="font-size:1.15rem; font-weight:900;">🐾 ${p.petName}</strong></td>
          <td style="font-size:0.95rem; color:#4b5563; font-weight:700;">${p.lineUserId}</td>
          <td><strong style="font-size:1.15rem; font-weight:900;">${p.count}</strong> 回</td>
          <td><strong style="font-size:1.05rem;">${p.lastDate}</strong></td>
          <td>
            <button class="btn-sm btn-sm-line" style="width:auto; padding:8px 14px; font-size:0.95rem;" onclick="openModal('${p.lineUserId}', '${p.ownerName}')">💬 LINE個別送信</button>
          </td>
        </tr>
      `).join('');
    }

    function updateStatus(rowIndex, newStatus) {
      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "updateStatus", rowIndex: rowIndex, status: newStatus })
      }).then(() => loadData());
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(`tab-${tabName}`).classList.add('active');
    }

    function openModal(userId, name) {
      currentTargetUserId = userId;
      document.getElementById('modalTargetName').innerText = `💬 ${name} 様へのメッセージ`;
      document.getElementById('msgModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('msgModal').style.display = 'none';
      document.getElementById('individualMsg').value = '';
    }

    function submitIndividualMsg() {
      const msg = document.getElementById('individualMsg').value;
      if (!msg) return alert('メッセージを入力してください');

      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "sendIndividual", lineUserId: currentTargetUserId, message: msg })
      })
      .then(res => res.json())
      .then(data => {
        if(data.status === 'success') {
          alert('LINEメッセージを送信しました！');
          closeModal();
        } else {
          alert('送信エラー: ' + data.message);
        }
      });
    }

    function sendBroadcast() {
      const msg = document.getElementById('broadcastMsg').value;
      if (!msg) return alert('一括配信メッセージを入力してください');
      if (!confirm('登録者全員に一斉配信します。よろしいですか？')) return;

      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "sendBroadcast", message: msg })
      })
      .then(res => res.json())
      .then(data => {
        alert('一括配信を実行しました！');
        document.getElementById('broadcastMsg').value = '';
      });
    }
  </script>
</body>
</html>
