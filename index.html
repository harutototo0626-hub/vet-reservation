<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>診察予約・ペット手帳</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; margin: 0; padding: 16px; color: #333; }
    .card { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); max-width: 480px; margin: 0 auto; }
    h2 { margin-top: 0; color: #06C755; font-size: 1.3rem; text-align: center; }
    label { font-size: 0.85rem; font-weight: bold; color: #555; display: block; margin-top: 16px; }
    input, select, textarea { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
    textarea { resize: vertical; }
    button { width: 100%; background: #06C755; color: #fff; border: none; padding: 14px; font-size: 1.05rem; font-weight: bold; border-radius: 8px; margin-top: 24px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #05b34c; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .notice { font-size: 0.75rem; color: #888; text-align: center; margin-top: 12px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🐾 診察予約フォーム</h2>
    <form id="reserveForm">
      <label>ペットのお名前 <span style="color:red;">*</span></label>
      <input type="text" id="petName" placeholder="例: チョコ" required>

      <label>診療メニュー <span style="color:red;">*</span></label>
      <select id="menu" required>
        <option value="一般診察">一般診察</option>
        <option value="予防接種・フィラリア">予防接種・フィラリア</option>
        <option value="健康診断">健康診断</option>
        <option value="爪切り・お手入れ">爪切り・お手入れ</option>
      </select>

      <label>希望日 <span style="color:red;">*</span></label>
      <input type="date" id="date" required>

      <label>希望時間 <span style="color:red;">*</span></label>
      <select id="time" required>
        <option value="09:00~">09:00~</option>
        <option value="10:00~">10:00~</option>
        <option value="11:00~">11:00~</option>
        <option value="15:00~">15:00~</option>
        <option value="16:00~">16:00~</option>
      </select>

      <label>気になる症状・備考</label>
      <textarea id="symptoms" rows="3" placeholder="いつからどんな症状があるか、持病やアレルギーなど"></textarea>

      <button type="submit" id="submitBtn">予約を確定する</button>
      <div class="notice">※送信するとスプレッドシートに即時保存されます</div>
    </form>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycby2hQKwINtq3r21e4pxhe_SQ_U_44ejXTA_Xp1mzsY7x4g7rF-zTM7YChI_ar5Rg2Y3nA/exec";
    
    // ★ 後で病院のLINE管理者から取得したらここに貼り付けます（今はそのままでOK）
    const LIFF_ID = "YOUR_LIFF_ID";
    let lineUserId = "WEB_TEST_USER"; // ブラウザテスト用ID

    // LIFF初期化（LINE外のブラウザで開いてもエラーで止まらない配慮済）
    if (LIFF_ID && LIFF_ID !== "YOUR_LIFF_ID") {
      liff.init({ liffId: LIFF_ID }).then(() => {
        if (liff.isLoggedIn()) {
          liff.getProfile().then(p => { lineUserId = p.userId; });
        }
      }).catch(err => console.log("LIFF初期化スキップ（Webテストモード）"));
    }

    // 本日の日付をデフォルト設定
    document.getElementById("date").valueAsDate = new Date();

    // フォーム送信処理
    document.getElementById("reserveForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerText = "送信中...";

      const payload = {
        lineUserId: lineUserId,
        petName: document.getElementById("petName").value,
        menu: document.getElementById("menu").value,
        date: document.getElementById("date").value,
        time: document.getElementById("time").value,
        symptoms: document.getElementById("symptoms").value
      };

      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        alert("予約を受け付けました！");
        if (typeof liff !== 'undefined' && liff.isInClient && liff.isInClient()) {
          liff.closeWindow(); // LINE内なら画面を閉じる
        } else {
          location.reload(); // ブラウザテストならリロード
        }
      })
      .catch(err => {
        alert("送信エラーが発生しました: " + err);
        btn.disabled = false;
        btn.innerText = "予約を確定する";
      });
    });
  </script>
</body>
</html>
